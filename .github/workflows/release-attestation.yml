name: Release attestation

# Each product's signed archives are attested here, where they are published:
# Cleven's under cleven-v tags and Troke's under troke-v tags. Each release
# waits for this run and verifies the result before it publishes its cask.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    if: startsWith(github.event.release.tag_name, 'cleven-v') || startsWith(github.event.release.tag_name, 'troke-v')
    runs-on: ubuntu-24.04
    steps:
      # Just after publication, GitHub's tag view of a release, which
      # `gh release download` reads, can list no assets for over half an hour.
      # The release's own asset list is current, so download by ID.
      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release-assets
          gh api "repos/$REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name | endswith(".tar.gz")) | [.id, .name] | @tsv' \
            > archives.tsv
          if [ ! -s archives.tsv ]; then
            echo "Release $RELEASE_ID has no .tar.gz asset to attest." >&2
            exit 1
          fi
          while IFS="$(printf '\t')" read -r id name; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/$REPOSITORY/releases/assets/$id" > "release-assets/$name"
          done < archives.tsv
      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*.tar.gz"
